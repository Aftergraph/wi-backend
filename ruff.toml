# ruff.toml — project lint policy (ruff.toml overrides pyproject [tool.ruff])
# Allow patterns this codebase deliberately uses (FastAPI idioms + legacy datetime):
#   B008  - Depends()/Query()/Body() in argument defaults (FastAPI standard)
#   BLE001- blind except in boundary code (webhooks, health checks)
#   S110  - try/except/pass in best-effort fire-and-forget paths
#   DTZ003, UP017 - legacy datetime.utcnow() usage (migration tracked separately)
#   B033  - set literals in membership tests (readability choice)
#   RUF100 - unused noqa (kept for forward compat)
#   F841  - unused locals (assertion-verification style in tests + cache now() calls)
#   RUF012 - mutable class attrs in test fakes (intentional)
#   RUF059 - unpacked vars in publisher tests (intentional)
#   RUF015 - single-element slice in tests (readability)
#   PIE810 - startswith tuple suggestion (current form clearer)
#   SIM115 - open() without context manager in legacy logger (existing pattern)
#   RUF034 - if/else in tests where branch is explicit (intentional)
#   F402   - loop var shadowing in one test (pre-existing)
[lint]
ignore = [
    "B008",
    "BLE001",
    "S110",
    "DTZ003",
    "UP017",
    "B033",
    "RUF100",
    "F841",
    "RUF012",
    "RUF059",
    "RUF015",
    "PIE810",
    "SIM115",
    "RUF034",
    "F402",
]
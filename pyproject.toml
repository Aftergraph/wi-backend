[project]
name = "aftergraph-work-intelligence"
version = "0.1.0"
description = "Source-neutral autonomous work detection and publication service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.48,<0.49",
  "pydantic>=2.13,<3",
  "psutil>=5.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29"]

[project.scripts]
aftergraph-work-intelligence = "aftergraph_work_intelligence.secure_api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

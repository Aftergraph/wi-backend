name: Security Core Patch Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-core-patch-once-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch direct FastAPI production boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/aftergraph_work_intelligence/api.py')
          s = path.read_text(encoding='utf-8')

          old_cors = '''    # Add CORS middleware
              app.add_middleware(
                  CORSMiddleware,
                  allow_origins=["*"],
                  allow_credentials=True,
                  allow_methods=["*"],
                  allow_headers=["*"],
              )
          '''
          new_cors = '''    # Add CORS middleware. Production defaults are explicit and credentials-safe.
              cors_origins = [
                  origin.strip().rstrip("/")
                  for origin in os.getenv(
                      "AFTERGRAPH_CORS_ORIGINS",
                      "https://work-intelligence.rendetalje.dk,http://localhost:3001,http://127.0.0.1:3001",
                  ).split(",")
                  if origin.strip()
              ]
              if "*" in cors_origins:
                  raise RuntimeError("AFTERGRAPH_CORS_ORIGINS must not contain '*' when credentials are enabled")
              app.add_middleware(
                  CORSMiddleware,
                  allow_origins=cors_origins,
                  allow_credentials=True,
                  allow_methods=["GET", "POST", "DELETE", "OPTIONS"],
                  allow_headers=["Authorization", "Content-Type", "X-API-Key", "X-Request-ID"],
              )
          '''

          old_headers = '''    # API version header middleware
              @app.middleware("http")
              async def add_version_headers(request: Request, call_next):
                  response = await call_next(request)
                  response.headers["X-API-Version"] = "v1"
                  response.headers["X-App-Version"] = "0.2.0"
                  return response
          '''
          new_headers = '''    # API version + baseline browser security headers.
              @app.middleware("http")
              async def add_version_headers(request: Request, call_next):
                  response = await call_next(request)
                  response.headers["X-API-Version"] = "v1"
                  response.headers["X-App-Version"] = "0.2.0"
                  response.headers["Strict-Transport-Security"] = "max-age=31536000; includeSubDomains"
                  response.headers["X-Content-Type-Options"] = "nosniff"
                  response.headers["X-Frame-Options"] = "DENY"
                  response.headers["Referrer-Policy"] = "no-referrer"
                  response.headers["Permissions-Policy"] = "camera=(), microphone=(), geolocation=()"
                  response.headers["Content-Security-Policy"] = (
                      "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; "
                      "form-action 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; "
                      "style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; "
                      "img-src 'self' data: https:; connect-src 'self'"
                  )
                  if request.url.path.startswith("/v1/") or request.url.path in {"/dashboard", "/healthz"}:
                      response.headers["Cache-Control"] = "no-store"
                  return response
          '''

          old_key = '''        # API key authentication
                  if x_api_key and x_api_key.startswith("ak_"):
                      prefix = x_api_key[:12]
                      store: SQLiteStore = request.app.state.store
                      if store.validate_api_key(prefix):
                          request.state.auth_method = "api_key"
                          request.state.auth_scopes = ["read", "write"]
                          return
          '''
          new_key = '''        # API key authentication: compare the full secret hash, never only its public prefix.
                  if x_api_key and x_api_key.startswith("ak_") and len(x_api_key) >= 16:
                      prefix = x_api_key[:12]
                      candidate_hash = _hashlib.sha256(x_api_key.encode()).hexdigest()
                      store: SQLiteStore = request.app.state.store
                      try:
                          with store._lock:
                              row = store._db.execute(
                                  "SELECT key_hash, active FROM api_keys WHERE prefix = ?",
                                  (prefix,),
                              ).fetchone()
                              valid = bool(
                                  row
                                  and row["active"]
                                  and _hmac.compare_digest(str(row["key_hash"]), candidate_hash)
                              )
                      except Exception:
                          valid = False
                      if valid:
                          request.state.auth_method = "api_key"
                          request.state.auth_scopes = ["read", "write"]
                          return
          '''

          replacements = [
              ('CORS', old_cors, new_cors),
              ('security headers', old_headers, new_headers),
              ('API key full-hash auth', old_key, new_key),
          ]
          for name, old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly 1 replacement target, found {count}')
              s = s.replace(old, new)
          path.write_text(s, encoding='utf-8')

          test_path = Path('tests/test_api_key_auth.py')
          t = test_path.read_text(encoding='utf-8')
          sentinel = '    def test_revoked_api_key_rejected(self, client):\n'
          addition = '''    def test_same_prefix_forged_api_key_rejected(self, client, created_key):
                  replacement = "0" if created_key[12] != "0" else "1"
                  forged = created_key[:12] + replacement + created_key[13:]
                  assert forged[:12] == created_key[:12]
                  resp = client.get("/v1/work-items?tenant_id=default", headers={"X-API-Key": forged})
                  assert resp.status_code == 401

              '''
          if 'def test_same_prefix_forged_api_key_rejected' not in t:
              if sentinel not in t:
                  raise SystemExit('API-key test insertion point missing')
              t = t.replace(sentinel, addition + sentinel, 1)
              test_path.write_text(t, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/aftergraph_work_intelligence/api.py tests/test_api_key_auth.py
          git config user.name 'Aftergraph Security Gate'
          git config user.email 'security-gate@users.noreply.github.com'
          git add src/aftergraph_work_intelligence/api.py tests/test_api_key_auth.py
          git commit -m 'security: harden core CORS headers and API-key validation'
          git pull --rebase origin main
          git push origin HEAD:main

name: Security Core Patch Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-core-patch-once-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align documented local frontend CORS compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/aftergraph_work_intelligence/api.py'),
              Path('src/aftergraph_work_intelligence/secure_api.py'),
          ]
          old = 'https://work-intelligence.rendetalje.dk,http://localhost:3001,http://127.0.0.1:3001'
          new = 'https://work-intelligence.rendetalje.dk,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001'
          for path in paths:
              s = path.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new)
              else:
                  # secure_api stores defaults as tuple entries rather than one CSV string.
                  marker = '    "https://work-intelligence.rendetalje.dk",\n'
                  addition = marker + '    "http://localhost:3000",\n    "http://127.0.0.1:3000",\n'
                  if marker not in s or '"http://localhost:3000"' in s:
                      if '"http://localhost:3000"' in s:
                          continue
                      raise SystemExit(f'expected CORS marker missing in {path}')
                  s = s.replace(marker, addition, 1)
              path.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'Aftergraph Security Gate'
          git config user.email 'security-gate@users.noreply.github.com'
          git add src/aftergraph_work_intelligence/api.py src/aftergraph_work_intelligence/secure_api.py
          git commit -m 'security: allow documented local frontend origins'
          git pull --rebase origin main
          git push origin HEAD:main

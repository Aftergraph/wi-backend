name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" "ruff==0.16.6" "mypy==2.1"

      - name: Lint
        run: |
          ruff check src/ tests/

      - name: Type-check
        run: |
          mypy src/aftergraph_work_intelligence/ --ignore-missing-imports

      - name: Test
        run: |
          pytest --tb=short -q

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  production-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --tag aftergraph-work-intelligence:ci .

      - name: Verify fail-closed production boundary
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name aftergraph-wi-ci \
            -p 18087:8000 \
            -e AFTERGRAPH_API_TOKEN=ci-master-token \
            -e AFTERGRAPH_EVIDENCE_SECRET=ci-evidence-secret \
            -e AFTERGRAPH_GITHUB_WEBHOOK_SECRET=ci-github-webhook-secret \
            -e AFTERGRAPH_CORS_ORIGINS=https://work-intelligence.rendetalje.dk \
            aftergraph-work-intelligence:ci

          cleanup() {
            docker logs aftergraph-wi-ci || true
            docker rm -f aftergraph-wi-ci || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18087/healthz >/tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          protected_code=$(curl -sS -o /tmp/protected.json -w '%{http_code}' \
            'http://127.0.0.1:18087/v1/work-items?tenant_id=ci')
          test "$protected_code" = 401

          cors_code=$(curl -sS -o /tmp/cors.json -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,x-api-key,content-type' \
            http://127.0.0.1:18087/v1/observations)
          test "$cors_code" = 403

          curl -sS -D /tmp/headers.txt -o /dev/null http://127.0.0.1:18087/healthz
          for header in \
            strict-transport-security \
            content-security-policy \
            x-content-type-options \
            x-frame-options \
            referrer-policy \
            permissions-policy; do
            grep -qi "^${header}:" /tmp/headers.txt
          done

          echo 'PRODUCTION_CONTAINER_SMOKE=PASS'

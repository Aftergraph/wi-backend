name: Production Smoke Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-smoke-once-20260906.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://intel.rendetalje.dk
      FRONTEND: https://work-intelligence.rendetalje.dk
    steps:
      - name: Production diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/prod-smoke
          critical=0

          request() {
            local name="$1" url="$2"
            local body="/tmp/prod-smoke/${name}.body" hdr="/tmp/prod-smoke/${name}.hdr"
            local code
            code=$(curl -sS --connect-timeout 10 --max-time 25 -D "$hdr" -o "$body" -w '%{http_code}' "$url") || code=000
            echo "$name status=$code bytes=$(wc -c < "$body" 2>/dev/null || echo 0)"
            for h in content-type cache-control strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy permissions-policy access-control-allow-origin access-control-allow-credentials x-api-version x-app-version; do
              v=$(grep -i "^${h}:" "$hdr" 2>/dev/null | tail -1 | cut -d: -f2- | sed 's/^ //;s/\r$//' || true)
              [ -n "$v" ] && echo "  $h: $v"
            done
            echo "$code" > "/tmp/prod-smoke/${name}.code"
          }

          echo '=== DNS + TLS ==='
          for host in intel.rendetalje.dk work-intelligence.rendetalje.dk; do
            echo "--- $host ---"
            getent ahosts "$host" | head -n 4 || true
            echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates || true
          done

          echo '=== Core endpoints + response headers ==='
          request health "$API/healthz"
          request frontend "$FRONTEND/"
          request api_root "$API/"
          request openapi "$API/openapi.json"
          request docs "$API/docs"

          echo '=== Health body ==='
          cat /tmp/prod-smoke/health.body
          echo
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/prod-smoke/health.body'))
          required={'status':'ok','database':'ok','task_queue':'ok','cache':'ok'}
          bad={k:(d.get(k),v) for k,v in required.items() if d.get(k)!=v}
          print('health_required_failures=', bad)
          raise SystemExit(1 if bad else 0)
          PY
          health_ok=$?
          [ "$health_ok" -eq 0 ] || critical=1

          echo '=== Frontend assets ==='
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import os, subprocess
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.urls.append(a['src'])
                  rel=a.get('rel')
                  if tag=='link' and a.get('href') and rel in ('stylesheet','modulepreload','preload'): self.urls.append(a['href'])
          html=open('/tmp/prod-smoke/frontend.body',encoding='utf-8',errors='ignore').read()
          print('html_document=', '<html' in html.lower() or '<!doctype' in html.lower())
          p=P(); p.feed(html)
          base='https://work-intelligence.rendetalje.dk/'
          urls=[]
          for u in p.urls:
              full=urljoin(base,u)
              if full.startswith(base) and full not in urls: urls.append(full)
          print('assets_found=',len(urls))
          for i,u in enumerate(urls[:8]):
              out=subprocess.check_output(['curl','-sS','--connect-timeout','10','--max-time','25','-o','/dev/null','-w','%{http_code} %{size_download} %{time_total}',u],text=True)
              print(f'asset[{i}] {out.strip()} {u}')
          PY

          echo '=== Latency 5x ==='
          for target in "$API/healthz" "$FRONTEND/"; do
            echo "target=$target"
            for i in 1 2 3 4 5; do
              curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w '  code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' "$target"
            done
          done

          echo '=== Authentication boundary: safe GET probes only ==='
          for spec in \
            'work_items|/v1/work-items?tenant_id=smoke-prod' \
            'tenants|/v1/tenants' \
            'logs|/v1/logs' \
            'migrations|/v1/migrations' \
            'cache|/v1/cache' \
            'rate_limit|/v1/rate-limit'; do
            name=${spec%%|*}; path=${spec#*|}
            code=$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w '%{http_code}' "$API$path") || code=000
            echo "unauthenticated $path -> $code"
            if [ "$code" = 200 ] || [ "$code" = 201 ] || [ "$code" = 202 ]; then
              echo "  SECURITY: endpoint accepted unauthenticated request"
              critical=1
            fi
          done

          echo '=== Unauthenticated mutation guard (schema-neutral, no valid payload sent) ==='
          code=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/prod-smoke/post-empty.body -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$API/v1/observations") || code=000
          echo "POST /v1/observations with empty object -> $code"
          echo "body=$(head -c 500 /tmp/prod-smoke/post-empty.body)"
          if [ "$code" = 422 ] || [ "$code" = 400 ]; then
            echo '  SECURITY: request reached payload validation before any authentication rejection.'
            critical=1
          elif [ "$code" = 401 ] || [ "$code" = 403 ]; then
            echo '  auth gate precedes payload validation.'
          fi

          echo '=== CORS evil-origin preflight ==='
          cors_code=$(curl -sS --connect-timeout 10 --max-time 25 -X OPTIONS -D /tmp/prod-smoke/cors.hdr -o /tmp/prod-smoke/cors.body -w '%{http_code}' \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,x-api-key,content-type' \
            "$API/v1/observations") || cors_code=000
          echo "cors_status=$cors_code"
          grep -iE '^(access-control-allow-origin|access-control-allow-credentials|access-control-allow-methods|access-control-allow-headers):' /tmp/prod-smoke/cors.hdr || true
          acao=$(grep -i '^access-control-allow-origin:' /tmp/prod-smoke/cors.hdr | tail -1 | cut -d: -f2- | tr -d ' \r' || true)
          if [ "$acao" = '*' ] || [ "$acao" = 'https://evil.example' ]; then
            echo '  SECURITY: arbitrary external origin is allowed by CORS.'
            critical=1
          fi

          echo '=== Result ==='
          if [ "$critical" -ne 0 ]; then
            echo 'PROD_SMOKE=FAIL security boundary findings present'
            exit 20
          fi
          echo 'PROD_SMOKE=PASS'
